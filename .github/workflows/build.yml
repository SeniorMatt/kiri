name: build

on:
  push:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit to build
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: make package
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        with:
          name: kiri-package
          path: kiri_*.tar.gz
